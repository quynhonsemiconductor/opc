<!doctype html>
<html lang="vi"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">

<body data-density="touch">
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <symbol id="i-back" viewBox="0 0 24 24"><path d="m12 19-7-7 7-7"></path> <path d="M19 12H5"></path></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle> <polyline points="12 6 12 12 16 14"></polyline></symbol>
  <symbol id="i-help" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle> <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path> <path d="M12 17h.01"></path></symbol>
  <symbol id="i-people" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path> <circle cx="9" cy="7" r="4"></circle> <path d="M22 21v-2a4 4 0 0 0-3-3.87"></path> <path d="M16 3.13a4 4 0 0 1 0 7.75"></path></symbol>
  <symbol id="i-phone" viewBox="0 0 24 24"><rect width="14" height="20" x="5" y="2" rx="2" ry="2"></rect> <path d="M12 18h.01"></path></symbol>
</svg>
<div class="r-onboard" data-component="OnboardingStep">
  <header class="r-onboard__top" data-part="OnboardingStep.top">
    <a class="c-icon-btn c-icon-btn--outline" href="readiness--new.html" aria-label="Quay lại Sẵn sàng" data-component="IconButton" data-variant="outline"><svg class="c-ic" aria-hidden="true" data-component="Icon"><use href="#i-back"></use></svg></a>
    <div class="c-steps" role="img" aria-label="Sẵn sàng: Xác minh chủ hộ" data-component="StepProgress"><span class="c-steps__label" data-part="StepProgress.label"><b>Sẵn sàng</b> · Xác minh chủ hộ</span></div>
    <a class="r-onboard__help" href="onboard-help.html" data-part="OnboardingStep.help"><svg class="c-ic" aria-hidden="true" data-component="Icon"><use href="#i-help"></use></svg>Hỏi</a>
  </header>
  <main class="r-onboard__body" data-part="OnboardingStep.body">
    <h1 class="r-onboard__title" data-part="OnboardingStep.title">Xác minh chủ hộ</h1>
    <p class="c-say" data-component="OwnerSentence">Chỉ cần khi ngân hàng hoặc nhà cung cấp hoá đơn đòi. Không xác minh thì OPC vẫn dùng đủ.</p>
    <div class="c-options" role="radiogroup" aria-label="Cách xác minh" data-component="OptionList"><button class="c-option c-option--big" type="button" role="radio" aria-checked="false" data-component="OptionCard" data-variant="big"><span class="c-option__radio" aria-hidden="true" data-part="OptionCard.radio"></span><span class="c-option__body" data-part="OptionCard.body"><strong class="c-option__title" data-part="OptionCard.title"><svg class="c-ic" aria-hidden="true" data-component="Icon"><use href="#i-phone"></use></svg>Tự xác minh trên điện thoại</strong><span class="c-option__meta" data-part="OptionCard.meta">nhanh nhất · cần căn cước gắn chip và máy có NFC · khoảng 2 phút</span></span></button><button class="c-option c-option--big" type="button" role="radio" aria-checked="false" data-component="OptionCard" data-variant="big"><span class="c-option__radio" aria-hidden="true" data-part="OptionCard.radio"></span><span class="c-option__body" data-part="OptionCard.body"><strong class="c-option__title" data-part="OptionCard.title"><svg class="c-ic" aria-hidden="true" data-component="Icon"><use href="#i-people"></use></svg>Nhân viên OPC xác minh cùng chị</strong><span class="c-option__meta" data-part="OptionCard.meta">dễ nhất · chị Thu mang máy đọc thẻ · Thứ Năm 02/07, 8:00</span></span></button><button class="c-option c-option--big" type="button" role="radio" aria-checked="false" data-component="OptionCard" data-variant="big"><span class="c-option__radio" aria-hidden="true" data-part="OptionCard.radio"></span><span class="c-option__body" data-part="OptionCard.body"><strong class="c-option__title" data-part="OptionCard.title"><svg class="c-ic" aria-hidden="true" data-component="Icon"><use href="#i-clock"></use></svg>Để sau</strong><span class="c-option__meta" data-part="OptionCard.meta">không mất gì · làm khi ngân hàng hoặc bên hoá đơn đòi</span></span></button></div>
    <p class="r-yn__hint" id="vf-why" data-part="Yn.hint">Chọn một cách để tiếp tục.</p>
    <p class="u-meta">OPC chỉ lưu họ tên và số căn cước (mã hoá), không lưu ảnh.</p>
    <p class="r-onboard__saved" data-part="OnboardingStep.saved">Đã lưu — làm tiếp lúc nào cũng được</p>
  </main>
  <footer class="r-onboard__foot" data-part="OnboardingStep.foot">
    <button class="c-btn c-btn--act c-btn--block" type="button" aria-disabled="true" aria-describedby="vf-why" data-component="Button" data-variant="act block" data-state="disabled">Tiếp tục</button>
    <div class="r-onboard__alt" data-part="OnboardingStep.alt"><a href="help.html">Vì sao có bên đòi xác minh?</a></div>
  </footer>
</div>


</body></html>

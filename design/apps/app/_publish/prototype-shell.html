<title>Prototype OPC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@600;700;800&family=Public+Sans:wght@400;500;600;700&display=swap&subset=vietnamese">
<style>
/* Layout: wayfinding shell — sidebar of flows and screens, a device stage that scales the real screen to fit. */
:root {
  --bg: #f4f4f0; --surface: #ffffff; --sunk: #e9eae5; --ink: #121514; --ink-2: #3d423f; --ink-3: #545a56;
  --line: #d6d8d2; --line-strong: #121514; --act: #ffc400; --on-act: #121514; --ok: #006b47; --pend: #0b4a8f;
  --font-display: "Barlow", "Public Sans", system-ui, sans-serif; --font-body: "Public Sans", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121514; --surface: #1c201f; --sunk: #262b29; --ink: #f2f2ee; --ink-2: #cfd2cc; --ink-3: #a9ada7;
  --line: #3a3f3d; --line-strong: #f2f2ee; --ok: #4fbf8f; --pend: #8db6ea; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #121514; --surface: #1c201f; --sunk: #262b29; --ink: #f2f2ee; --ink-2: #cfd2cc; --ink-3: #a9ada7;
  --line: #3a3f3d; --line-strong: #f2f2ee; --ok: #4fbf8f; --pend: #8db6ea; color-scheme: dark }
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 15px/1.45 var(--font-body); font-variant-numeric: tabular-nums; }
button, select { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--line-strong); outline-offset: 2px; box-shadow: 0 0 0 6px var(--act); }

.app { display: grid; grid-template-columns: 300px minmax(0, 1fr); height: 100%; }
.side { display: flex; flex-direction: column; min-height: 0; border-right: 2px solid var(--line-strong); background: var(--surface); }
.brand { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
.brand b { background: #121514; color: var(--act); padding: 5px 7px; border-radius: 4px; font: 700 15px/1 var(--font-display); letter-spacing: .02em; }
.brand span { display: grid; line-height: 1.2; }
.brand strong { font: 700 16px/1.2 var(--font-display); }
.brand small { font-size: 13px; color: var(--ink-3); }
.lists { overflow: auto; padding: 8px 10px 24px; display: grid; gap: 4px; align-content: start; }
.lists h2 { margin: 14px 6px 4px; font: 700 13px/1.2 var(--font-display); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); }
.it { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 8px; width: 100%; min-height: 40px; padding: 6px 10px; line-height: 1.3; border: 0; border-radius: 4px; background: none; text-align: left; cursor: pointer; }
.it:hover { background: var(--sunk); }
.it[aria-current="true"] { background: var(--ink); color: var(--bg); }
.it .n { font: 700 13px/1 var(--font-display); color: var(--ink-3); }
.it[aria-current="true"] .n { color: var(--act); }
.it.state { margin-left: 12px; width: calc(100% - 12px); padding-left: 12px; border-left: 2px solid var(--line); border-radius: 0 4px 4px 0; font-size: 14px; color: var(--ink-2); }
.flow { border: 2px solid var(--line-strong); font-weight: 600; }
.flow .n { color: var(--ink); }

.main { display: grid; grid-template-rows: auto auto minmax(0, 1fr); min-width: 0; min-height: 0; }
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--surface); }
.seg { display: inline-grid; grid-auto-flow: column; border: 2px solid var(--line-strong); border-radius: 4px; overflow: hidden; }
.seg button { min-height: 40px; padding: 0 14px; border: 0; background: var(--surface); font: 700 14px/1 var(--font-display); cursor: pointer; }
.seg button + button { border-left: 2px solid var(--line-strong); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.step { display: flex; align-items: center; gap: 8px; margin-left: auto; }
.btn { min-height: 40px; padding: 0 14px; border: 2px solid var(--line-strong); border-radius: 4px; background: var(--surface); font: 700 14px/1 var(--font-display); cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; }
.btn.act { background: var(--act); color: var(--on-act); }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.caption { display: grid; gap: 2px; padding: 10px 16px; border-bottom: 1px solid var(--line); }
.caption .k { font: 700 13px/1.2 var(--font-display); letter-spacing: .04em; text-transform: uppercase; color: var(--ink-3); }
.caption .t { font: 700 20px/1.2 var(--font-display); text-wrap: balance; }
.caption .d { color: var(--ink-2); max-width: 75ch; }
.stage { min-height: 0; overflow: auto; padding: 16px; }
.frame { margin: 0 auto; transform-origin: top left; }
.frame iframe { display: block; border: 2px solid var(--line-strong); background: #fff; }
.hint { padding: 8px 16px 14px; font-size: 13px; color: var(--ink-3); }

.pick { display: none; }
@media (max-width: 860px) {
  .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); }
  .side { border-right: 0; border-bottom: 2px solid var(--line-strong); }
  .lists { display: none; }
  .pick { display: block; padding: 0 16px 12px; }
  .pick select { width: 100%; min-height: 44px; padding: 0 10px; border: 2px solid var(--line-strong); border-radius: 4px; background: var(--surface); }
  .step { margin-left: 0; width: 100%; justify-content: space-between; }
}
@media (prefers-reduced-motion: no-preference) { .frame { transition: height .2s; } }
</style>

<div class="app">
  <aside class="side">
    <div class="brand"><b>OPC</b><span><strong>Prototype · app chủ hộ</strong><small id="ver">Hải sản khô Cô Hai · thiết kế v1.5</small></span></div>
    <div class="pick"><label class="k" for="sel" style="display:block;font:700 13px/1.2 var(--font-display);margin:0 0 6px;color:var(--ink-3)">Chọn luồng hoặc màn</label><select id="sel"></select></div>
    <nav class="lists" id="lists" aria-label="Luồng và màn hình"></nav>
  </aside>
  <section class="main">
    <div class="bar">
      <div class="seg" role="group" aria-label="Kích thước màn hình" id="sizes">
        <button type="button" data-w="1440" aria-pressed="true">Máy tính 1440</button>
        <button type="button" data-w="1024" aria-pressed="false">1024</button>
        <button type="button" data-w="390" aria-pressed="false">Điện thoại 390</button>
      </div>
      <div class="step" id="stepbar">
        <button class="btn" type="button" id="prev">← Bước trước</button>
        <span id="pos" style="font:700 15px/1 var(--font-display)"></span>
        <button class="btn act" type="button" id="next">Bước sau →</button>
      </div>
    </div>
    <div class="caption"><span class="k" id="ck"></span><span class="t" id="ct"></span><span class="d" id="cd"></span></div>
    <div class="stage" id="stage"><div class="frame" id="frame"><iframe id="f" title="Màn hình OPC"></iframe></div>
      <p class="hint">Bấm thử trong màn hình: các nút liên kết giữa màn hoạt động. Phím ← → để đi giữa các bước. Đây là bản thiết kế (dữ liệu mẫu), không phải ứng dụng thật.</p></div>
  </section>
</div>

<script>
const DATA = /*DATA*/{};
const H = { 1440: 900, 1024: 768, 390: 844 };
const $ = (id) => document.getElementById(id);
let width = 1440, flow = null, step = 0, current = null;
const byFile = Object.fromEntries(DATA.screens.map(s => [s.file, s]));

function render() {
  let h = '<h2>Luồng</h2>' + DATA.flows.map((fl, i) =>
    `<button class="it flow" type="button" data-flow="${i}"><span>${fl.name}</span><span class="n">${fl.steps.length} bước</span></button>`).join('');
  for (const g of DATA.groups) {
    h += `<h2>${g.name}</h2>` + g.files.map(f => {
      const s = byFile[f]; if (!s) return '';
      return `<button class="it${s.stateOf ? ' state' : ''}" type="button" data-file="${f}"><span>${s.title}</span><span class="n">${s.sizes === 'phone' ? '390' : ''}</span></button>`;
    }).join('');
  }
  $('lists').innerHTML = h;
  $('sel').innerHTML = DATA.flows.map((fl, i) => `<option value="flow:${i}">▶ ${fl.name}</option>`).join('') +
    DATA.groups.map(g => `<optgroup label="${g.name}">` + g.files.filter(f => byFile[f]).map(f => `<option value="${f}">${byFile[f].title}</option>`).join('') + '</optgroup>').join('');
}

function fit() {
  const avail = $('stage').clientWidth - 32;
  const s = Math.min(1, avail / (width + 4));
  const fr = $('frame');
  fr.style.width = (width + 4) + 'px';
  fr.style.transform = `scale(${s})`;
  fr.style.height = ((H[width] + 4) * s) + 'px';
  fr.style.marginLeft = s < 1 ? '0' : 'auto';
  $('f').style.width = width + 'px'; $('f').style.height = H[width] + 'px';
}

function setWidth(w) {
  width = w;
  document.querySelectorAll('#sizes button').forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.w === w)));
  fit();
}

function open(file, k) {
  const s = byFile[file] || { title: file, note: '' };
  current = file;
  $('f').src = 'screens/' + file;
  if (s.sizes === 'phone' && width !== 390) setWidth(390);
  if (s.sizes === 'desktop' && width === 390) setWidth(1440);
  $('ck').textContent = k || (s.stateOf ? 'Trạng thái' : 'Màn hình');
  $('ct').textContent = s.title;
  $('cd').textContent = s.note || '';
  document.querySelectorAll('.it').forEach(b => b.setAttribute('aria-current', String(!flow && b.dataset.file === file || (flow && b.dataset.flow == DATA.flows.indexOf(flow)))));
  try { history.replaceState(null, '', '#' + file.replace(/\.html$/, '')); } catch (e) {}
}

function showStep() {
  const f = flow.steps[step];
  $('pos').textContent = `${step + 1}/${flow.steps.length}`;
  $('prev').disabled = step === 0; $('next').disabled = step === flow.steps.length - 1;
  open(f, `${flow.name} · bước ${step + 1}/${flow.steps.length}`);
}

function startFlow(i) { flow = DATA.flows[i]; step = 0; $('stepbar').hidden = false; showStep(); }
function openScreen(file) { flow = null; $('stepbar').hidden = true; open(file); }

render();
$('lists').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; b.dataset.flow ? startFlow(+b.dataset.flow) : openScreen(b.dataset.file); });
$('sel').addEventListener('change', e => { const v = e.target.value; v.startsWith('flow:') ? startFlow(+v.slice(5)) : openScreen(v); });
$('sizes').addEventListener('click', e => { const b = e.target.closest('button'); if (b) setWidth(+b.dataset.w); });
$('prev').onclick = () => { if (flow && step > 0) { step--; showStep(); } };
$('next').onclick = () => { if (flow && step < flow.steps.length - 1) { step++; showStep(); } };
addEventListener('keydown', e => { if (e.target.tagName === 'SELECT') return; if (e.key === 'ArrowRight') $('next').click(); if (e.key === 'ArrowLeft') $('prev').click(); });
new ResizeObserver(fit).observe($('stage'));
if (innerWidth < 860) width = 390;
setWidth(width);
const start = (location.hash || '').slice(1);
if (start && byFile[start + '.html']) openScreen(start + '.html'); else startFlow(0);
</script>

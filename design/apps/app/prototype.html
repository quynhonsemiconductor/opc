<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>OPC — app (owner, staff, accountant) prototype</title>
<style>
:root{--bg:#f3f4f6;--surface:#fff;--sunk:#e8eaee;--ink:#14161a;--ink-2:#454b55;--ink-3:#5d6470;--line:#d8dbe1;--accent:#14161a;--on-accent:#fff;
  --font:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121418;--surface:#1b1e23;--sunk:#262a31;--ink:#eef0f3;--ink-2:#c5cad2;--ink-3:#9aa1ab;--line:#353a42;--accent:#eef0f3;--on-accent:#121418;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121418;--surface:#1b1e23;--sunk:#262a31;--ink:#eef0f3;--ink-2:#c5cad2;--ink-3:#9aa1ab;--line:#353a42;--accent:#eef0f3;--on-accent:#121418;color-scheme:dark}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 14px/1.45 var(--font);font-variant-numeric:tabular-nums}
button,select{font:inherit;color:inherit}:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:288px minmax(0,1fr);height:100%}
.side{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line);background:var(--surface)}
.brand{padding:16px;border-bottom:1px solid var(--line)}.brand strong{display:block;font-size:15px}.brand small{color:var(--ink-3)}
.lists{overflow:auto;padding:8px 10px 24px;display:grid;gap:2px;align-content:start}
.lists h2{margin:14px 8px 4px;font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3)}
.it{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:8px;width:100%;min-height:36px;padding:6px 10px;border:0;border-radius:8px;background:none;text-align:left;cursor:pointer}
.it:hover{background:var(--sunk)}.it[aria-current="true"]{background:var(--accent);color:var(--on-accent)}
.it .n{font-size:12px;color:var(--ink-3)}.it[aria-current="true"] .n{color:inherit;opacity:.8}
.it.state{margin-left:12px;width:calc(100% - 12px);font-size:13px;color:var(--ink-2)}.it.state[aria-current="true"]{color:var(--on-accent)}
.it.flow{font-weight:600}
.main{display:grid;grid-template-rows:auto auto minmax(0,1fr);min-width:0;min-height:0}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--surface)}
.seg{display:inline-flex;gap:2px;padding:2px;border-radius:10px;background:var(--sunk)}
.seg button{min-height:32px;padding:0 12px;border:0;border-radius:8px;background:none;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:0 1px 2px rgb(0 0 0/.12);font-weight:600}
.step{display:flex;align-items:center;gap:8px;margin-left:auto}
.btn{min-height:32px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);cursor:pointer}
.btn.pri{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}.btn[disabled]{opacity:.4;cursor:not-allowed}
.caption{display:grid;gap:2px;padding:10px 16px;border-bottom:1px solid var(--line)}
.caption .k{font-size:12px;color:var(--ink-3)}.caption .t{font-size:18px;font-weight:650;text-wrap:balance}.caption .d{color:var(--ink-2);max-width:75ch}
.stage{min-height:0;overflow:auto;padding:16px}.frame{margin:0 auto;transform-origin:top left}
.frame iframe{display:block;border:1px solid var(--line);border-radius:6px;background:#fff}
.frame.phone{padding:10px;border-radius:54px;background:#0d0e10;box-shadow:0 18px 40px rgb(0 0 0/.25)}.frame.phone iframe{border:0;border-radius:44px}
.hint{padding:8px 0;font-size:12px;color:var(--ink-3)}.pick{display:none}
@media (max-width:860px){.app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
  .side{border-right:0;border-bottom:1px solid var(--line)}.lists{display:none}.pick{display:block;padding:0 16px 12px}
  .pick select{width:100%;min-height:44px;padding:0 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
  .step{margin-left:0;width:100%;justify-content:space-between}}
</style></head><body>
<div class="app"><aside class="side">

</section></div>

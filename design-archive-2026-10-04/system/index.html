<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Design directions</title><style>
:root{--bg:#f4f3ef;--fg:#1c1b19;--mu:#6b6862;--ln:#dcd9d2}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 ui-sans-serif,system-ui,sans-serif}
header{padding:28px 32px 16px;border-bottom:1px solid var(--ln)}h1{margin:0 0 12px;font-size:22px}
nav{display:flex;flex-wrap:wrap;gap:6px}button{font:inherit;font-size:13px;padding:6px 12px;border:1px solid var(--ln);background:#fff;border-radius:6px;cursor:pointer}
button[aria-pressed=true]{background:var(--fg);color:#fff}main{padding:24px 32px;display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
figure{margin:0;background:#fff;border:1px solid var(--ln);border-radius:8px;overflow:hidden}img{width:100%;display:block;cursor:zoom-in}
figcaption{padding:10px 12px;font-size:13px;border-top:1px solid var(--ln)}.miss{padding:40px;color:var(--mu);text-align:center}
dialog{padding:0;border:0;background:transparent}dialog img{max-width:96vw;max-height:94vh}dialog::backdrop{background:#000c}
@media(max-width:1000px){main{grid-template-columns:1fr;padding:16px}header{padding:16px}}</style></head><body>
<header><h1>Design directions</h1><nav id=v><button aria-pressed=true data-v="_eval">_eval</button><button aria-pressed=false data-v="_round">_round</button><button aria-pressed=false data-v="counter--payment-390">counter--payment-390</button><button aria-pressed=false data-v="counter-1024">counter-1024</button><button aria-pressed=false data-v="counter-1024@0.5">counter-1024@0.5</button><button aria-pressed=false data-v="counter-1280">counter-1280</button><button aria-pressed=false data-v="counter-1440">counter-1440</button><button aria-pressed=false data-v="counter-1440@0.5">counter-1440@0.5</button><button aria-pressed=false data-v="counter-390">counter-390</button><button aria-pressed=false data-v="counter-390@0.5">counter-390@0.5</button><button aria-pressed=false data-v="home-1024">home-1024</button><button aria-pressed=false data-v="home-1024@0.5">home-1024@0.5</button><button aria-pressed=false data-v="home-1280">home-1280</button><button aria-pressed=false data-v="home-1440">home-1440</button><button aria-pressed=false data-v="home-1440@0.5">home-1440@0.5</button><button aria-pressed=false data-v="home-390">home-390</button><button aria-pressed=false data-v="home-390@0.5">home-390@0.5</button><button aria-pressed=false data-v="tile-1200">tile-1200</button></nav></header>
<main id=g></main><dialog id=z><img alt=""></dialog><script>
const D=[{"id":"a-so-tay","name":"a-so-tay","shots":["_eval.png","_round.png","counter--payment-390.png","counter-1024.png","counter-1280.png","counter-1440.png","counter-390.png","home-1024.png","home-1280.png","home-1440.png","home-390.png","r1","tile-1200.png"]},{"id":"b-bang-gia","name":"b-bang-gia","shots":["tile-1200.png"]},{"id":"c-bien-lang","name":"c-bien-lang","shots":["tile-1200.png"]},{"id":"d-bien-lai","name":"d-bien-lai","shots":["tile-1200.png"]},{"id":"e-tro-chuyen","name":"e-tro-chuyen","shots":["tile-1200.png"]},{"id":"f-chi-dan","name":"f-chi-dan","shots":["_eval.png","_round.png","counter--payment-390.png","counter-1024.png","counter-1024@0.5.png","counter-1280.png","counter-1440.png","counter-1440@0.5.png","counter-390.png","counter-390@0.5.png","home-1024.png","home-1024@0.5.png","home-1280.png","home-1440.png","home-1440@0.5.png","home-390.png","home-390@0.5.png","tile-1200.png"]}];
const g=document.getElementById('g'),z=document.getElementById('z');
function r(v){g.innerHTML=D.map(d=>'<figure>'+(d.shots.includes(v+'.png')?'<img src="directions/'+d.id+'/shots/'+v+'.png">':'<div class=miss>no '+v+'</div>')+'<figcaption><b>'+d.name+'</b></figcaption></figure>').join('');
g.querySelectorAll('img').forEach(i=>i.onclick=()=>{z.querySelector('img').src=i.src;z.showModal()})}
z.onclick=()=>z.close();document.getElementById('v').onclick=e=>{const b=e.target.closest('button');if(!b)return;document.querySelectorAll('#v button').forEach(x=>x.setAttribute('aria-pressed',x===b));r(b.dataset.v)};
r("_eval");</script></body></html>
